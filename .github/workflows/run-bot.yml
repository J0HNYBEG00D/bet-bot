name: Betting Bot - Dropping Odds

on:
  schedule:
    # Τρέχει κάθε 10 λεπτά από 08:30 έως 20:00 UTC
    # = 11:30 έως 23:00 ώρα Ελλάδος (EEST)
    - cron: '30/10 8-19 * * *'
  workflow_dispatch:  # Δυνατότητα χειροκίνητης εκτέλεσης

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 8          # Ασφάλεια - δεν αφήνουμε να τρέξει πολύ

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Betting Bot
        env:
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python bot.py
