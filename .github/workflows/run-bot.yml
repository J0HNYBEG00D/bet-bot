name: Run Betting Bot Daily

on:
  schedule:
    # Βάρδια 1: Τρέχει κάθε μέρα στις 08:30 UTC (11:30 ώρα Ελλάδος)
    - cron: '30 8 * * *'
    # Βάρδια 2: Τρέχει κάθε μέρα στις 14:30 UTC (17:30 ώρα Ελλάδος)
    - cron: '30 14 * * *'
  workflow_dispatch: # Για να το πατάς κι εσύ χειροκίνητα

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Python Bot
        env:
          SHARP_API_KEY: ${{ secrets.SHARP_API_KEY }}
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python bot.py

